<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How 20.07 connects a group</title>
  <desc id="d">A group relays over Bluetooth. Any phone with a connection becomes a bridge through public relays to a distant group, even to phones with Bluetooth off.</desc>
  <style>
    .bg{fill:#000}
    .mesh{stroke:#7dff86;stroke-opacity:.5;stroke-width:1.8;fill:none;stroke-dasharray:2 7;stroke-linecap:round;animation:flow 1.8s linear infinite}
    .link{stroke:#7dff86;stroke-width:2.6;fill:none;stroke-linecap:round}
    .ghost{stroke:#7dff86;stroke-opacity:.45;stroke-width:2;fill:none;stroke-dasharray:1 9;stroke-linecap:round}
    .node{fill:#000;stroke:#7dff86;stroke-width:2.2}
    .core{fill:#7dff86}
    .ring{fill:none;stroke:#7dff86;stroke-opacity:.3;stroke-width:1.6}
    .pill{fill:#000;stroke:#7dff86;stroke-width:2.2}
    .h{font:600 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#eaf5ec;text-anchor:middle}
    .p{font:400 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#8fa896;text-anchor:middle}
    @keyframes flow{to{stroke-dashoffset:-18}}
    @media (prefers-reduced-motion:reduce){.mesh{animation:none}}
  </style>
  <defs>
    <g id="n"><circle class="node" r="11"/><circle class="core" r="4"/></g>
    <g id="b"><circle class="ring" r="27"/><circle class="node" r="14"/><circle class="core" r="5.5"/></g>
  </defs>
  <rect class="bg" width="960" height="400"/>

  <!-- left group: Bluetooth mesh -->
  <g class="mesh">
    <path d="M90,250 L165,185"/><path d="M90,250 L165,305"/><path d="M165,185 L165,305"/>
    <path d="M165,185 L250,245"/><path d="M165,305 L250,245"/><path d="M250,245 L330,190"/>
  </g>
  <use href="#n" x="90" y="250"/><use href="#n" x="165" y="185"/><use href="#n" x="165" y="305"/><use href="#n" x="250" y="245"/>
  <use href="#b" x="330" y="190"/>

  <!-- right group: out of range -->
  <g class="mesh">
    <path d="M870,250 L795,185"/><path d="M870,250 L795,305"/><path d="M795,185 L795,305"/>
    <path d="M795,185 L710,245"/><path d="M795,305 L710,245"/><path d="M710,245 L630,190"/>
  </g>
  <use href="#n" x="870" y="250"/><use href="#n" x="795" y="185"/><use href="#n" x="795" y="305"/><use href="#n" x="710" y="245"/>
  <use href="#b" x="630" y="190"/>

  <!-- public relays -->
  <text class="p" x="480" y="48">public relays</text>
  <rect class="pill" x="390" y="62" width="180" height="44" rx="22"/>
  <circle class="core" cx="440" cy="84" r="5"/><circle class="core" cx="480" cy="84" r="5"/><circle class="core" cx="520" cy="84" r="5"/>
  <path id="up" class="link" d="M330,176 C330,120 358,84 390,84"/>
  <path id="down" class="link" d="M570,84 C602,84 630,120 630,176"/>
  <circle r="4.5" class="core"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#up"/></animateMotion></circle>
  <circle r="4.5" class="core"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#down"/></animateMotion></circle>

  <!-- Bluetooth-off phone reached over the internet only -->
  <path class="ghost" d="M570,84 C700,62 820,76 872,118"/>
  <circle class="ring" cx="880" cy="140" r="27"/><use href="#n" x="880" y="140"/>
  <text class="p" x="868" y="196" style="font-size:16px">internet only</text>

  <!-- captions on one baseline -->
  <text class="h" x="210" y="362">Bluetooth mesh</text><text class="p" x="210" y="388">no signal needed</text>
  <text class="h" x="480" y="362">The bridge</text><text class="p" x="480" y="388">any phone with a connection</text>
  <text class="h" x="760" y="362">Out of range</text><text class="p" x="760" y="388">even with Bluetooth off</text>
</svg>
